
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

projects:
  - name: evolution-api
    environments:
      - name: production
        services:
          - type: web
            name: evolution-api
            runtime: docker

            # Build the official Evolution API repository
            repo: https://github.com/evolution-foundation/evolution-api
            branch: main

            dockerfilePath: ./Dockerfile
            dockerContext: .

            plan: starter
            region: oregon
            numInstances: 1

            healthCheckPath: /

            disk:
              name: evolution-instances
              mountPath: /evolution/instances
              sizeGB: 1

            envVars:
              - key: PORT
                value: "8080"

              - key: SERVER_PORT
                value: "8080"

              - key: SERVER_TYPE
                value: http

              - key: SERVER_URL
                fromService:
                  name: evolution-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL

              - key: AUTHENTICATION_API_KEY
                generateValue: true

              # External PostgreSQL database
              - key: DATABASE_PROVIDER
                value: postgresql

              - key: DATABASE_CONNECTION_URI
                sync: false

              - key: DATABASE_CONNECTION_CLIENT_NAME
                value: evolution_render

              # Local cache and persistent session storage
              - key: CACHE_REDIS_ENABLED
                value: "false"

              - key: CACHE_LOCAL_ENABLED
                value: "true"

              - key: CACHE_REDIS_SAVE_INSTANCES
                value: "false"

              - key: TELEMETRY_ENABLED
                value: "false"

              - key: LOG_LEVEL
                value: ERROR,WARN,INFO,LOG

              - key: DEL_INSTANCE
                value: "false"

              - key: TZ
                value: UTC

              - key: LANGUAGE
                value: en
